{% extends 'dashboard/base.html' %}
{% block posts_active %}active{% endblock %}

{% block content %}
<div class="card mt-4" style="max-width: 500px;">
    <div class="card-body text-center">
        <h4>🗑️ Delete "{{ post.name }}"?</h4>
        <p class="text-muted">
            This will remove the post.
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'dashboard-posts' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
