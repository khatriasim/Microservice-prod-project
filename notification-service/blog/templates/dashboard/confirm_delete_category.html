{% extends 'dashboard/base.html' %}
{% block category_active %}active{% endblock %}

{% block content %}
<div class="card mt-4" style="max-width: 500px;">
    <div class="card-body text-center">
        <h4>🗑️ Delete "{{ category.name }}"?</h4>
        <p class="text-muted">
            This will remove the category. Posts using it will not be deleted,
            but they will lose this category tag.
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'blog-category' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
